
# On every push to main: build the React app, upload it to S3,
# then tell CloudFront to drop its cached copies.

name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write           # lets the workflow ask AWS for temporary credentials (OIDC)
  contents: read            # lets it check out the code

concurrency:
  group: deploy-frontend    # never run two frontend deploys at the same time
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci              # installs exactly what package-lock.json lists

      - name: Build
        run: npm run build       # creates dist/

      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Upload to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          # 1. New JS/CSS first. Their names contain a hash, so a file with a given name
          #    never changes, and browsers may keep it for a year.
          aws s3 sync dist/ "s3://$BUCKET" \
            --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Then index.html, which points at the new files. "no-cache" makes browsers
          #    check for a newer one every visit.
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"

          # 3. Finally remove files from older builds that are no longer used.
          aws s3 sync dist/ "s3://$BUCKET" --delete --exclude index.html

      - name: Clear CloudFront's cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"